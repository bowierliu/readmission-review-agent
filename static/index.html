<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Investigate changes in synthetic 30-day heart failure readmission data.">
  <title>Readmission Review Agent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to case</a>
  <header class="masthead">
    <div class="layout masthead-inner">
      <div class="wordmark">
        <span class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M3.5 13h4l2.7-6.3 3.5 10.6 2.4-4.3h4.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Readmission Review Agent</span>
      </div>
      <span class="dataset-badge">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>
        Synthetic data
      </span>
    </div>
  </header>

  <main id="workspace" class="layout page" tabindex="-1">
    <div id="case-load" class="load-notice" role="status">
      <p id="load-message">Loading cases…</p>
      <button id="retry-cases" class="button button-secondary" type="button" hidden>Retry loading cases</button>
    </div>

    <div id="case-content" hidden>
      <div class="case-switcher">
        <span id="case-selector-label" class="field-label">Select case</span>
        <div id="case-selector" class="segmented" role="group" aria-labelledby="case-selector-label"></div>
        <button id="compare-cases" class="button button-secondary" type="button"
                aria-controls="compare-view" aria-pressed="false">Compare A and B</button>
      </div>

      <p id="run-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <section id="case-view" class="case-view" aria-labelledby="case-title">
        <header class="case-heading">
          <h1 id="case-title" tabindex="-1"></h1>
          <p id="case-situation"></p>
        </header>

        <section id="verdict" class="verdict" aria-labelledby="verdict-title" hidden>
          <p class="eyebrow">Verdict</p>
          <h2 id="verdict-title" tabindex="-1"></h2>
          <p id="verdict-support"></p>
        </section>

        <div class="metric-comparison" aria-label="Reported readmission rates and counts">
          <div class="metric-period">
            <p class="metric-label">Baseline <span id="prior-month" class="metric-month"></span></p>
            <div id="prior-rate" class="metric-value"></div>
            <p id="prior-counts" class="metric-denominator"></p>
          </div>
          <div class="metric-connector" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </div>
          <div class="metric-period metric-latest">
            <p class="metric-label">Latest <span id="current-month" class="metric-month"></span></p>
            <div class="latest-value">
              <div id="current-rate" class="metric-value"></div>
              <span id="provisional" class="small-badge" hidden>Provisional</span>
            </div>
            <p id="current-counts" class="metric-denominator"></p>
          </div>
          <div class="delta">
            <p id="delta-rate" class="delta-value"></p>
            <p id="delta-caption" class="metric-denominator"></p>
          </div>
          <p id="metric-provenance" class="provenance metric-provenance"></p>
        </div>

        <div id="signal-summary" class="signal-summary" hidden></div>

        <section id="next-action" class="panel next-action" aria-labelledby="next-action-title" hidden>
          <div>
            <h2 id="next-action-title" tabindex="-1">Next action</h2>
            <p id="next-action-text"></p>
          </div>
          <div class="action-controls">
            <a id="jump-to-gap" href="#evidence-reconcile_sources" hidden></a>
            <button id="mark-reviewed" class="button button-secondary" type="button">Mark reviewed</button>
          </div>
          <p id="review-error" class="inline-error" role="alert" hidden></p>
        </section>

        <div class="run-controls">
          <label class="mode-choice">
            <span class="field-label">Investigation mode</span>
            <select id="run-mode">
              <option value="checklist">Checklist (fresh)</option>
              <option value="replay">Saved trace</option>
              <option value="live">Live agent</option>
            </select>
          </label>
          <div class="run-buttons">
            <button type="button" id="run-investigation" class="button button-primary">
              <span id="run-icon" class="button-icon" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M8 5.1v13.8a.6.6 0 0 0 .9.5l10.3-6.9a.6.6 0 0 0 0-1l-10.3-7a.6.6 0 0 0-.9.6Z"/></svg>
              </span>
              <span id="run-label">Run investigation</span>
            </button>
            <button type="button" id="run-fresh" class="button button-secondary" hidden>Run fresh</button>
          </div>
        </div>
        <p id="run-error" class="inline-error" role="alert" hidden></p>

        <section id="evidence-panel" class="panel output-panel" aria-labelledby="evidence-tab" hidden>
          <h2 id="evidence-tab">Tool evidence</h2>
          <div id="evidence-content"></div>
        </section>

        <section id="draft-panel" class="panel output-panel" aria-labelledby="draft-tab" hidden>
          <h2 id="draft-tab">Review draft</h2>
          <div id="draft-content"></div>
        </section>

        <aside id="progress-panel" class="panel progress-panel" aria-labelledby="progress-title" hidden>
          <div class="progress-header">
            <h2 id="progress-title">Checks run</h2>
            <p id="progress-description" class="panel-description"></p>
          </div>
          <ol id="progress-steps" class="progress-steps"></ol>
        </aside>
      </section>

      <section id="compare-view" aria-labelledby="compare-title" hidden>
        <h1 id="compare-title" tabindex="-1">Compare Case A and Case B</h1>
        <div id="compare-output"></div>
      </section>

      <footer class="workspace-footer">Interview demo <span aria-hidden="true">·</span> Synthetic data</footer>
    </div>
    <noscript>This workspace requires JavaScript to run investigations.</noscript>
  </main>
</body>
</html>
